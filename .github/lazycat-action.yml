version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/nullbr115.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: nullbr115
    bump: patch

build:
  run_buildscript: false

images:
  # 上游 Docker Hub 仅存 mutable 别名（latest），无 immutable 版本 tag 家族（0.2.1.9 等已删除）
  # → custom/created + digest-pin + patch 自增；digest 由 Action 首次运行验证后回写
  - id: nullbr115
    target: service
    service: nullbr115
    source: gravityle/nullbr115
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Nullbr115
    summary: "Nullbr115是一个海量资源库项目,支持ed2k/磁力离线下载，支持115、123网盘转存"
